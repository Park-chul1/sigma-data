name: Research data checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-research.txt
      - name: Install isolated research dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Compile all Python execution and test files
        run: python -m compileall -q src scripts tests
      - name: Run synthetic tests without WRDS or licensed data
        run: python -m unittest discover -s tests -v
